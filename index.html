<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>PC City: Engineer's Journey — Final Edition</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      background: #05050f;
      color: #fff;
      user-select: none;
    }

    #city-view {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 15% 10%, #1a1a4a 0%, transparent 45%),
        radial-gradient(circle at 85% 15%, #2a1050 0%, transparent 45%),
        radial-gradient(circle at 50% 90%, #0a2040 0%, transparent 50%),
        linear-gradient(180deg, #050515 0%, #0a0a2a 60%, #05050f 100%);
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: #fff;
      border-radius: 50%;
      animation: twinkle 3s infinite;
      pointer-events: none;
    }

    @keyframes twinkle {

      0%,
      100% {
        opacity: 0.15;
      }

      50% {
        opacity: 1;
      }
    }

    #ground {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 38%;
      background: linear-gradient(180deg, #0f0f25 0%, #05050f 100%);
      border-top: 3px solid #4facfe;
      box-shadow: 0 -15px 50px rgba(79, 172, 254, 0.35);
      pointer-events: none;
    }

    #ground::before {
      content: '';
      position: absolute;
      top: 38%;
      left: 0;
      right: 0;
      height: 5px;
      background: repeating-linear-gradient(90deg, #ffd700 0 45px, transparent 45px 90px);
      opacity: 0.55;
    }

    #ground::after {
      content: '';
      position: absolute;
      bottom: 8%;
      left: 0;
      right: 0;
      height: 2px;
      background: repeating-linear-gradient(90deg, #00f2fe 0 25px, transparent 25px 50px);
      opacity: 0.3;
    }

    .building {
      position: absolute;
      bottom: 38%;
      width: 175px;
      height: 210px;
      background: linear-gradient(145deg, #2a2a5a, #15153a);
      border: 3px solid #4facfe;
      border-radius: 14px 14px 5px 5px;
      cursor: pointer;
      transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s;
      padding-top: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 0 25px rgba(79, 172, 254, 0.5), inset 0 0 30px rgba(79, 172, 254, 0.1);
      z-index: 5;
    }

    .building:hover {
      transform: translateY(-12px);
      box-shadow: 0 0 60px rgba(79, 172, 254, 1), 0 15px 40px rgba(0, 0, 0, 0.7);
      border-color: #00f2fe;
    }

    .building.done {
      border-color: #00e676;
      box-shadow: 0 0 35px rgba(0, 230, 118, 0.9);
    }

    .building.done::before {
      content: '✓';
      position: absolute;
      top: -15px;
      right: -15px;
      width: 36px;
      height: 36px;
      background: #00e676;
      color: #05050f;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2em;
      font-weight: bold;
      box-shadow: 0 0 20px #00e676;
      z-index: 5;
    }

    .building.locked {
      opacity: 0.42;
      filter: grayscale(0.9);
      cursor: not-allowed;
    }

    .building.locked:hover {
      transform: none;
    }

    .building .icon {
      font-size: 3.6em;
      margin-top: 5px;
      filter: drop-shadow(0 0 10px rgba(79, 172, 254, 0.8));
    }

    .building h3 {
      font-size: 0.92em;
      margin-top: 8px;
      color: #fff;
      text-align: center;
      padding: 0 6px;
      line-height: 1.2;
    }

    .building .sub {
      font-size: 0.7em;
      color: #8a8ab0;
      margin-top: 3px;
      text-align: center;
      padding: 0 5px;
    }

    .building .badge {
      position: absolute;
      bottom: -14px;
      left: 50%;
      transform: translateX(-50%);
      background: #4facfe;
      color: #05050f;
      font-size: 0.72em;
      padding: 3px 12px;
      border-radius: 12px;
      font-weight: bold;
      white-space: nowrap;
      box-shadow: 0 0 15px rgba(79, 172, 254, 0.7);
    }

    .building.done .badge {
      background: #00e676;
    }

    .building.locked .badge {
      background: #555;
    }

    .win {
      position: absolute;
      width: 22px;
      height: 22px;
      background: #ffd700;
      border-radius: 3px;
      box-shadow: 0 0 12px #ffd700;
      animation: flicker 2s infinite;
      pointer-events: none;
    }

    @keyframes flicker {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.35;
      }
    }

    #player {
      position: absolute;
      width: 60px;
      height: 88px;
      z-index: 50;
      pointer-events: none;
      will-change: left, top;
      filter: drop-shadow(0 0 18px #4facfe);
    }

    #player .head {
      width: 38px;
      height: 38px;
      background: linear-gradient(145deg, #ffdbac, #e0b088);
      border-radius: 50%;
      margin: 0 auto;
      position: relative;
      box-shadow: 0 0 14px rgba(255, 219, 172, 0.7);
    }

    #player .head .eye {
      position: absolute;
      width: 7px;
      height: 7px;
      background: #000;
      border-radius: 50%;
      top: 16px;
    }

    #player .head .eye.l {
      left: 6px;
    }

    #player .head .eye.r {
      right: 6px;
    }

    #player .head .mouth {
      position: absolute;
      width: 10px;
      height: 3px;
      background: #8b4513;
      border-radius: 0 0 5px 5px;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
    }

    #player .body {
      width: 46px;
      height: 42px;
      background: linear-gradient(180deg, #4facfe, #00f2fe);
      border-radius: 12px;
      margin: 3px auto 0;
      box-shadow: 0 0 22px rgba(79, 172, 254, 0.9);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #player .body::after {
      content: '⚙';
      font-size: 20px;
      filter: brightness(0.4);
    }

    #player .legs {
      display: flex;
      justify-content: space-around;
      width: 46px;
      margin: 0 auto;
    }

    #player .legs div {
      width: 15px;
      height: 18px;
      background: #1a1a3a;
      border-radius: 0 0 6px 6px;
      border-top: 2px solid #4facfe;
    }

    #player.walking .legs div:nth-child(1) {
      animation: legL 0.3s infinite;
    }

    #player.walking .legs div:nth-child(2) {
      animation: legR 0.3s infinite;
    }

    @keyframes legL {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-4px);
      }
    }

    @keyframes legR {

      0%,
      100% {
        transform: translateY(-4px);
      }

      50% {
        transform: translateY(0);
      }
    }

    #shadow {
      position: absolute;
      width: 50px;
      height: 12px;
      background: radial-gradient(ellipse, rgba(0, 0, 0, 0.6), transparent 70%);
      z-index: 49;
      pointer-events: none;
    }

    #hud {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 200;
      background: rgba(10, 10, 30, 0.92);
      border: 2px solid #4facfe;
      border-radius: 18px;
      padding: 12px 18px;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 30px rgba(79, 172, 254, 0.5);
    }

    #hud h1 {
      font-size: 1.02em;
      color: #4facfe;
      letter-spacing: 2px;
    }

    #hud .row {
      display: flex;
      gap: 14px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    #hud .item {
      text-align: center;
      min-width: 52px;
    }

    #hud .item .lbl {
      font-size: 0.6em;
      color: #8a8ab0;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #hud .item .val {
      font-size: 1.15em;
      font-weight: bold;
      color: #ffd700;
    }

    #hud .item .val.blue {
      color: #4facfe;
    }

    #hud .item .val.green {
      color: #00e676;
    }

    #xp-bar-container {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 280px;
      max-width: 40vw;
      z-index: 200;
    }

    #xp-label {
      text-align: center;
      font-size: 0.72em;
      color: #a855f7;
      font-weight: bold;
      margin-bottom: 4px;
    }

    #xp-bar {
      height: 12px;
      background: rgba(10, 10, 30, 0.9);
      border: 2px solid #a855f7;
      border-radius: 20px;
      overflow: hidden;
    }

    #xp-fill {
      height: 100%;
      background: linear-gradient(90deg, #a855f7, #ec4899, #f59e0b);
      border-radius: 20px;
      transition: width 0.6s;
    }

    #top-btns {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 200;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .top-btn {
      background: rgba(10, 10, 30, 0.92);
      border: 2px solid #4facfe;
      color: #4facfe;
      padding: 9px 14px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.78em;
      font-weight: bold;
      backdrop-filter: blur(10px);
      transition: 0.3s;
      font-family: inherit;
    }

    .top-btn:hover {
      background: #4facfe;
      color: #05050f;
    }

    .top-btn.gold {
      border-color: #ffd700;
      color: #ffd700;
    }

    .top-btn.gold:hover {
      background: #ffd700;
      color: #05050f;
    }

    .top-btn.green {
      border-color: #00e676;
      color: #00e676;
    }

    .top-btn.green:hover {
      background: #00e676;
      color: #05050f;
    }

    .top-btn.purple {
      border-color: #a855f7;
      color: #a855f7;
    }

    .top-btn.purple:hover {
      background: #a855f7;
      color: #fff;
    }

    .top-btn.red {
      border-color: #ff5252;
      color: #ff5252;
    }

    .top-btn.red:hover {
      background: #ff5252;
      color: #fff;
    }

    #controls-hint {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 10, 30, 0.92);
      border: 1px solid #4facfe;
      border-radius: 30px;
      padding: 8px 22px;
      color: #b8b8d0;
      font-size: 0.8em;
      z-index: 200;
      text-align: center;
      white-space: nowrap;
    }

    #controls-hint kbd {
      background: #4facfe;
      color: #05050f;
      padding: 2px 8px;
      border-radius: 5px;
      font-weight: bold;
      margin: 0 2px;
      font-size: 0.9em;
    }

    #nearby-prompt {
      position: absolute;
      z-index: 100;
      display: none;
      background: linear-gradient(90deg, #ffd700, #ffb300);
      color: #05050f;
      padding: 8px 18px;
      border-radius: 22px;
      font-weight: bold;
      font-size: 0.88em;
      animation: pulse 1s infinite;
      white-space: nowrap;
      box-shadow: 0 0 25px #ffd700;
      pointer-events: none;
    }

    @keyframes pulse {

      0%,
      100% {
        transform: translate(-50%, -100%) scale(1);
      }

      50% {
        transform: translate(-50%, -100%) scale(1.08);
      }
    }

    #modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.94);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    #modal-overlay.active {
      display: flex;
    }

    #modal {
      background: linear-gradient(145deg, #141432, #0a0a20);
      border: 2px solid #4facfe;
      border-radius: 25px;
      max-width: 900px;
      width: 100%;
      max-height: 94vh;
      overflow-y: auto;
      padding: 28px;
      position: relative;
      box-shadow: 0 0 90px rgba(79, 172, 254, 0.7);
      animation: modalIn 0.4s;
    }

    @keyframes modalIn {
      from {
        transform: scale(0.85);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    #modal::-webkit-scrollbar {
      width: 8px;
    }

    #modal::-webkit-scrollbar-thumb {
      background: #4facfe;
      border-radius: 10px;
    }

    #close-modal {
      position: absolute;
      top: 15px;
      right: 20px;
      background: rgba(255, 82, 82, 0.2);
      border: 1px solid #ff5252;
      color: #ff5252;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      font-size: 1.2em;
      cursor: pointer;
      z-index: 10;
    }

    #close-modal:hover {
      background: #ff5252;
      color: #fff;
    }

    .m-header {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 15px;
      padding-bottom: 15px;
      border-bottom: 2px solid rgba(79, 172, 254, 0.3);
    }

    .m-header .m-icon {
      font-size: 3.2em;
    }

    .m-header h2 {
      font-size: 1.55em;
      color: #4facfe;
    }

    .m-header p {
      font-size: 0.85em;
      color: #b8b8d0;
      margin-top: 3px;
    }

    .progress-wrap {
      background: rgba(255, 255, 255, 0.1);
      height: 8px;
      border-radius: 20px;
      margin: 12px 0;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #4facfe, #00f2fe);
      transition: width 0.5s;
      border-radius: 20px;
    }

    .q-box {
      background: rgba(255, 255, 255, 0.04);
      border-radius: 16px;
      padding: 22px;
      border-left: 5px solid #4facfe;
    }

    .q-num {
      font-size: 0.75em;
      color: #8a8ab0;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .q-text {
      font-size: 1.12em;
      line-height: 1.6;
      margin-bottom: 18px;
      color: #e0e0ff;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(255, 255, 255, 0.12);
      padding: 14px 18px;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.25s;
      font-size: 0.98em;
      color: #d0d0f0;
      text-align: left;
      font-family: inherit;
    }

    .option:hover:not(.dis) {
      background: rgba(79, 172, 254, 0.15);
      border-color: #4facfe;
      transform: translateX(6px);
    }

    .option.correct {
      background: rgba(0, 230, 118, 0.25);
      border-color: #00e676;
      color: #00e676;
      font-weight: bold;
    }

    .option.wrong {
      background: rgba(255, 82, 82, 0.2);
      border-color: #ff5252;
      color: #ff5252;
    }

    .option.dis {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .fb {
      margin-top: 15px;
      padding: 16px;
      border-radius: 12px;
      font-size: 0.95em;
      line-height: 1.6;
      display: none;
    }

    .fb.show {
      display: block;
      animation: fbIn 0.4s;
    }

    @keyframes fbIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .fb.clue {
      background: rgba(255, 193, 7, 0.15);
      border-left: 5px solid #ffc107;
      color: #ffe082;
    }

    .fb.correct {
      background: rgba(0, 230, 118, 0.15);
      border-left: 5px solid #00e676;
      color: #a0ffc0;
    }

    .fb .expl-box {
      margin-top: 14px;
      padding: 14px;
      background: rgba(79, 172, 254, 0.12);
      border-left: 4px solid #4facfe;
      border-radius: 10px;
      color: #cfe6ff;
      line-height: 1.6;
    }

    .fb .expl-box .expl-title {
      color: #4facfe;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .next-btn {
      display: none;
      margin-top: 20px;
      padding: 14px 42px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(90deg, #4facfe, #00f2fe);
      color: #05050f;
      font-size: 1em;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
    }

    .next-btn.show {
      display: inline-block;
    }

    .next-btn:hover {
      transform: scale(1.06);
    }

    #final-screen {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: radial-gradient(circle at center, #1a1a4a, #05050f);
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
      padding: 30px;
      overflow-y: auto;
    }

    #final-screen.show {
      display: flex;
    }

    #final-screen .trophy {
      font-size: 7em;
      filter: drop-shadow(0 0 40px #ffd700);
    }

    #final-screen h1 {
      font-size: 2.8em;
      background: linear-gradient(90deg, #ffd700, #ff8c00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 15px 0;
      letter-spacing: 3px;
    }

    #final-screen .score {
      font-size: 1.9em;
      color: #4facfe;
      margin: 15px 0;
    }

    #final-screen .msg {
      font-size: 1.05em;
      color: #b8b8d0;
      max-width: 650px;
      line-height: 1.7;
      margin-bottom: 15px;
    }

    #final-screen .replay {
      margin-top: 20px;
      padding: 14px 40px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(90deg, #4facfe, #00f2fe);
      color: #05050f;
      font-size: 1.05em;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
    }

    #achv-overlay,
    #picker-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.94);
      z-index: 1500;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-y: auto;
    }

    #achv-overlay.active,
    #picker-overlay.active {
      display: flex;
    }

    .panel {
      background: linear-gradient(145deg, #141432, #0a0a20);
      border: 2px solid #a855f7;
      border-radius: 25px;
      max-width: 1000px;
      width: 100%;
      padding: 30px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .panel h2 {
      color: #a855f7;
      text-align: center;
      margin-bottom: 8px;
      font-size: 1.7em;
    }

    .panel .sub {
      text-align: center;
      color: #b8b8d0;
      margin-bottom: 20px;
      font-size: 0.9em;
    }

    .achv-grid,
    .picker-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    .achv-card,
    .picker-card {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(168, 85, 247, 0.3);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
    }

    .achv-card.unlocked {
      border-color: #ffd700;
      background: rgba(255, 215, 0, 0.08);
    }

    .achv-card.locked {
      opacity: 0.5;
      filter: grayscale(0.6);
    }

    .achv-card .ai {
      font-size: 2.4em;
      margin-bottom: 6px;
    }

    .achv-card .an {
      font-size: 0.95em;
      color: #fff;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .achv-card .ad {
      font-size: 0.75em;
      color: #8a8ab0;
    }

    .picker-card {
      border-color: rgba(79, 172, 254, 0.3);
      cursor: pointer;
      transition: 0.3s;
    }

    .picker-card:hover {
      border-color: #4facfe;
      background: rgba(79, 172, 254, 0.15);
      transform: translateY(-5px);
    }

    .picker-card .pi {
      font-size: 2.4em;
      margin-bottom: 8px;
    }

    .picker-card .pn {
      font-size: 1em;
      color: #fff;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .picker-card .ps {
      font-size: 0.78em;
      color: #8a8ab0;
    }

    .panel-close {
      margin-top: 20px;
      padding: 12px 30px;
      border: 2px solid #ff5252;
      background: transparent;
      color: #ff5252;
      border-radius: 50px;
      cursor: pointer;
      font-weight: bold;
      font-family: inherit;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    .panel-close:hover {
      background: #ff5252;
      color: #fff;
    }

    #toast {
      position: fixed;
      top: 20%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      background: linear-gradient(90deg, #00e676, #00b0ff);
      color: #05050f;
      padding: 16px 38px;
      border-radius: 20px;
      font-size: 1.1em;
      font-weight: bold;
      z-index: 5000;
      opacity: 0;
      pointer-events: none;
      transition: 0.4s;
      text-align: center;
      max-width: 90vw;
    }

    #toast.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    #toast.gold {
      background: linear-gradient(90deg, #ffd700, #ff8c00);
    }

    .puzzle {
      padding: 15px;
    }

    .puzzle-title {
      font-size: 1.05em;
      color: #4facfe;
      margin-bottom: 12px;
      text-align: center;
    }

    .drop-zone {
      background: rgba(79, 172, 254, 0.08);
      border: 3px dashed #4facfe;
      border-radius: 15px;
      padding: 20px;
      min-height: 130px;
      margin-bottom: 15px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: center;
      transition: 0.3s;
    }

    .drop-zone.over {
      background: rgba(79, 172, 254, 0.25);
      border-color: #00f2fe;
    }

    .draggable {
      background: linear-gradient(145deg, #2a2a5a, #1a1a3a);
      border: 2px solid #4facfe;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: grab;
      font-size: 0.85em;
      color: #fff;
      text-align: center;
    }

    .draggable .di {
      font-size: 1.6em;
      display: block;
    }

    .draggable.correct {
      border-color: #00e676;
      background: linear-gradient(145deg, #0d3320, #1a4d30);
    }

    .draggable.wrong-shake {
      animation: shake 0.5s;
    }

    @keyframes shake {

      0%,
      100% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-8px);
      }

      75% {
        transform: translateX(8px);
      }
    }

    #levelup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      padding: 30px 60px;
      background: linear-gradient(135deg, #a855f7, #ec4899);
      color: #fff;
      font-size: 2em;
      font-weight: bold;
      border-radius: 20px;
      z-index: 4000;
      pointer-events: none;
      text-align: center;
      letter-spacing: 2px;
    }

    #levelup.show {
      animation: levelupPop 2s forwards;
    }

    @keyframes levelupPop {
      0% {
        transform: translate(-50%, -50%) scale(0) rotate(-10deg);
      }

      20% {
        transform: translate(-50%, -50%) scale(1.1) rotate(3deg);
      }

      40% {
        transform: translate(-50%, -50%) scale(1) rotate(0);
      }

      80% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(1.2);
      }
    }

    @media (max-width:700px) {
      .building {
        width: 120px;
        height: 150px;
      }

      .building .icon {
        font-size: 2.2em;
      }

      .building h3 {
        font-size: 0.72em;
      }

      .building .sub {
        display: none;
      }

      #player {
        width: 44px;
        height: 64px;
      }

      #hud h1 {
        font-size: 0.85em;
      }

      #hud .item .val {
        font-size: 0.95em;
      }

      #controls-hint {
        font-size: 0.68em;
        padding: 6px 14px;
      }

      .top-btn {
        font-size: 0.68em;
        padding: 6px 9px;
      }

      #xp-bar-container {
        width: 200px;
      }
    }
  </style>
</head>

    /* ============================================================
       SAVE / LOAD
       ============================================================ */
    function saveGame(silent) {
      const save = {
        score: state.score, correct: state.correct, total: state.total,
        streak: state.streak, bestStreak: state.bestStreak,
        coins: state.coins, xp: state.xp, level: state.level, title: state.title,
        achievements: state.achievements,
        districts: state.districts.map(d => ({ id: d.id, done: d.done, idx: d.idx, practiceDone: d.practiceDone, unlocked: d.unlocked }))
      };
      try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); if (!silent) toast('💾 Progress Saved!', true); }
      catch (e) { if (!silent) toast('⚠️ Could not save', false); }
    }

    function loadGame() {
      try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (!raw) return;
        const save = JSON.parse(raw);
        Object.assign(state, {
          score: save.score || 0, correct: save.correct || 0, total: save.total || 0,
          streak: save.streak || 0, bestStreak: save.bestStreak || 0,
          coins: save.coins || 0, xp: save.xp || 0, level: save.level || 1,
          title: save.title || 'Trainee', achievements: save.achievements || {}
        });
        save.districts.forEach(d => {
          const dist = state.districts.find(x => x.id === d.id);
          if (dist) { dist.done = d.done; dist.idx = d.idx; dist.practiceDone = d.practiceDone; dist.unlocked = d.unlocked; }
        });
        state.districts[0].unlocked = true;
      } catch (e) { console.warn(e); }
    }

    function resetGame() {
      if (!confirm('Reset all progress?')) return;
      localStorage.removeItem(SAVE_KEY);
      location.reload();
    }

    /* ============================================================
       XP / LEVEL
       ============================================================ */
    function xpForLevel(l) { return 100 + (l - 1) * 80; }
    const TITLES = ['Trainee', 'Technician', 'Junior Engineer', 'Engineer', 'Senior Engineer', 'Specialist', 'Senior Specialist', 'Lead Engineer', 'Principal Engineer', 'Master Engineer', 'Grand Master'];
    function addXP(amount) {
      state.xp += amount;
      let leveled = false;
      while (state.xp >= xpForLevel(state.level)) {
        state.xp -= xpForLevel(state.level);
        state.level++;
        leveled = true;
      }
      state.title = TITLES[Math.min(state.level - 1, TITLES.length - 1)];
      if (leveled) showLevelUp();
      updateXPUI();
    }
    function showLevelUp() {
      const lv = document.getElementById('levelup');
      lv.textContent = `⚡ LEVEL ${state.level} — ${state.title}! ⚡`;
      lv.classList.remove('show'); void lv.offsetWidth; lv.classList.add('show');
      playSound('levelup');
    }
    function updateXPUI() {
      document.getElementById('lvl').textContent = state.level;
      document.getElementById('title').textContent = state.title;
      document.getElementById('xp').textContent = state.xp;
      document.getElementById('xp-fill').style.width = (state.xp / xpForLevel(state.level) * 100) + '%';
    }

    /* ============================================================
       SOUND
       ============================================================ */
    let audioCtx = null;
    function ensureAudio() { if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } } }
    function playSound(type) {
      ensureAudio(); if (!audioCtx) return;
      const notes = { correct: [{ f: 523, d: 0.08 }, { f: 659, d: 0.08 }, { f: 784, d: 0.12 }], wrong: [{ f: 220, d: 0.15 }, { f: 180, d: 0.15 }], levelup: [{ f: 523, d: 0.1 }, { f: 659, d: 0.1 }, { f: 784, d: 0.1 }, { f: 1047, d: 0.2 }], click: [{ f: 800, d: 0.03 }] };
      const seq = notes[type] || notes.click;
      let t = audioCtx.currentTime;
      seq.forEach(n => {
        const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
        o.type = 'sine'; o.frequency.value = n.f;
        g.gain.setValueAtTime(0.001, t);
        g.gain.exponentialRampToValueAtTime(0.12, t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.001, t + n.d);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(t); o.stop(t + n.d); t += n.d * 0.9;
      });
    }

    /* ============================================================
       TOAST
       ============================================================ */
    function toast(msg, gold) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = gold ? 'gold show' : 'show';
      clearTimeout(t._t);
      t._t = setTimeout(() => t.className = '', 2200);
    }

    const cityView = document.getElementById('city-view');
    const playerEl = document.getElementById('player');
    const shadowEl = document.getElementById('shadow');
    const promptEl = document.getElementById('nearby-prompt');

    for (let i = 0; i < 90; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      s.style.left = Math.random() * 100 + '%';
      s.style.top = Math.random() * 55 + '%';
      s.style.animationDelay = (Math.random() * 3) + 's';
      cityView.appendChild(s);
    }

    const buildingEls = [];
    function rebuildCity() {
      buildingEls.forEach(el => el.remove());
      buildingEls.length = 0;
      state.districts.forEach((b, i) => {
        const el = document.createElement('div');
        el.className = 'building';
        if (b.done) el.classList.add('done');
        if (!b.unlocked) el.classList.add('locked');
        el.style.left = b.x + '%';
        el.innerHTML = `
      <div class="win" style="top:26px;left:18px;"></div>
      <div class="win" style="top:26px;right:18px;animation-delay:0.5s;"></div>
      <div class="win" style="top:62px;left:18px;animation-delay:1s;"></div>

        el.addEventListener('click', () => {
          if (!b.unlocked) { toast('🔒 Complete previous district first!', false); return; }

    /* ============================================================
       PLAYER MOVEMENT
       ============================================================ */
    const player = { x: 5, y: 55, speed: 0.9 };
    const keys = {};
    let currentNearby = -1;

    function updatePlayerPos() {
      const w = window.innerWidth, h = window.innerHeight;
      const px = (player.x / 100) * (w - 60);
      const py = (player.y / 100) * (h - 220) + 60;
      playerEl.style.left = px + 'px';
      playerEl.style.top = py + 'px';
      shadowEl.style.left = (px + 5) + 'px';
      shadowEl.style.top = (py + 82) + 'px';
    }

    window.addEventListener('keydown', e => {
      const k = e.key.toLowerCase();
      keys[k] = true;
      if (e.key === 'e' || e.key === 'E') {
        if (currentNearby >= 0) openMission(currentNearby);
      }
      if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) {
        e.preventDefault();
      }
    }, { passive: false });
    window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
    window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

    let touchStart = null;
    document.addEventListener('touchstart', e => {
      if (e.target.closest('#modal-overlay, #achv-overlay, #picker-overlay, .top-btn, .panel')) return;
      touchStart = e.touches[0];
    }, { passive: true });
    document.addEventListener('touchmove', e => {
      if (!touchStart || e.target.closest('#modal-overlay, #achv-overlay, #picker-overlay')) return;
      const t = e.touches[0];
      const dx = t.clientX - touchStart.clientX, dy = t.clientY - touchStart.clientY;
      if (Math.hypot(dx, dy) > 8) {
        if (Math.abs(dx) > Math.abs(dy)) { keys.a = false; keys.d = false; keys[dx > 0 ? 'd' : 'a'] = true; }
        else { keys.w = false; keys.s = false; keys[dy > 0 ? 's' : 'w'] = true; }
        touchStart = { clientX: t.clientX, clientY: t.clientY };
      }
    }, { passive: true });
    document.addEventListener('touchend', () => { keys.a = keys.d = keys.w = keys.s = false; touchStart = null; });

    function gameLoop() {
      let moved = false;
      if (keys.a || keys.arrowleft) { player.x -= player.speed; moved = true; }
      if (keys.d || keys.arrowright) { player.x += player.speed; moved = true; }
      if (keys.w || keys.arrowup) { player.y -= player.speed; moved = true; }
      if (keys.s || keys.arrowdown) { player.y += player.speed; moved = true; }
      player.x = Math.max(1, Math.min(95, player.x));
      player.y = Math.max(8, Math.min(72, player.y));
      if (moved) playerEl.classList.add('walking'); else playerEl.classList.remove('walking');
      updatePlayerPos();
      checkNearby();
      requestAnimationFrame(gameLoop);
    }

    function checkNearby() {
      const w = window.innerWidth;
      const px = (player.x / 100) * w;
      let found = -1;
      state.districts.forEach((b, i) => {
        const bx = (b.x / 100) * w + 85;
        if (Math.abs(px - bx) < 100) found = i;
      });
      if (found !== currentNearby) {
        currentNearby = found;
        if (found >= 0) {
          const b = state.districts[found];
          if (b.unlocked) {
            const bx = (b.x / 100) * w + 85;
            promptEl.style.left = bx + 'px';
            promptEl.style.top = (window.innerHeight * 0.38 - 30) + 'px';
            promptEl.style.display = 'block';
          } else promptEl.style.display = 'none';
        } else promptEl.style.display = 'none';
      }
    }

    /* ============================================================
       MODAL / MISSIONS
       ============================================================ */
    const modalOverlay = document.getElementById('modal-overlay');
    const modalContent = document.getElementById('modal-content');
    let activeMission = null;
    let answered = false;

    function openMission(id) {
      const b = state.districts[id];
      if (!b.unlocked) { toast('🔒 Locked!', false); return; }
      activeMission = b;
      answered = false;
      modalOverlay.classList.add('active');
      if (!b.practiceDone && b.practice) renderPractice();
      else if (b.idx < b.questions.length) renderQ();
      else closeModal();
    }

    function closeModal() {
      modalOverlay.classList.remove('active');
      activeMission = null;
      promptEl.style.display = 'none';
    }

      <div class="puzzle-title">${p.title}</div>
      <div class="drop-zone" id="dz-seq"></div>
      <div class="puzzle-title" style="margin-top:12px;">Available Items:</div>
      <div class="drop-zone" id="dz-items" style="border-style:solid;border-color:#4facfe;background:rgba(79,172,254,0.05);min-height:100px;"></div>
      <div class="fb" id="pfb"></div>
      <button class="next-btn" id="pnext" onclick="finishPractice()">Continue to Challenges ➜</button>
    </div>
  `;
      setupPuzzle(p);
    }

    function setupPuzzle(p) {
      const itemsPool = document.getElementById('dz-items');
      p.items.forEach(it => {
        const d = document.createElement('div');
        d.className = 'draggable';
        d.draggable = true;
        d.dataset.item = it.id;
        d.innerHTML = `<span class="di">${it.icon}</span>${it.label}`;
        d.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', it.id); d.style.opacity = '0.4'; });
        d.addEventListener('dragend', () => d.style.opacity = '1');
        d.addEventListener('touchstart', touchDragStart, { passive: true });
        itemsPool.appendChild(d);
      });

      const seqZone = document.getElementById('dz-seq');
      if (p.zones.length > 1) {
        seqZone.innerHTML = '';
        const container = document.createElement('div');
        container.style.display = 'grid';
        container.style.gridTemplateColumns = 'repeat(auto-fit, minmax(180px, 1fr))';
        container.style.gap = '12px';
        container.style.width = '100%';
        p.zones.forEach(z => {
          const zone = document.createElement('div');
          zone.className = 'drop-zone';
          zone.dataset.zone = z.id;
          zone.style.flexDirection = 'column';
          zone.style.minHeight = '100px';
          zone.innerHTML = `<div style="text-align:center;color:#4facfe;font-weight:bold;width:100%;margin-bottom:6px;">${z.label}</div>`;
          container.appendChild(zone);
        });
        seqZone.appendChild(container);
      } else {
        seqZone.dataset.zone = p.zones[0].id;
        seqZone.innerHTML = `<div style="text-align:center;color:#4facfe;font-weight:bold;width:100%;">${p.zones[0].label}</div>`;
        seqZone.style.flexDirection = 'column';
      }

      document.querySelectorAll('.drop-zone').forEach(zone => {
        if (zone.id === 'dz-items') return;
        zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('over'); });
        zone.addEventListener('dragleave', () => zone.classList.remove('over'));
        zone.addEventListener('drop', e => {
          e.preventDefault(); zone.classList.remove('over');
          const id = e.dataTransfer.getData('text/plain');
          handleDrop(id, zone, p);
        });
      });
    }

    let touchDragEl = null;
    function touchDragStart(e) {
      touchDragEl = e.currentTarget;
      touchDragEl.style.opacity = '0.6';
      const move = ev => {
        ev.preventDefault();
        const t = ev.touches[0];
        const el = document.elementFromPoint(t.clientX, t.clientY);
        const z = el ? el.closest('.drop-zone') : null;
        if (z && z.id !== 'dz-items') {
          document.querySelectorAll('.drop-zone').forEach(x => x.classList.remove('over'));
          z.classList.add('over');
        }
      };
      const end = ev => {
        const t = ev.changedTouches[0];
        const el = document.elementFromPoint(t.clientX, t.clientY);
        const zone = el ? el.closest('.drop-zone') : null;
        if (zone && zone.id !== 'dz-items') handleDrop(touchDragEl.dataset.item, zone, activeMission.practice);
        document.querySelectorAll('.drop-zone').forEach(x => x.classList.remove('over'));
        if (touchDragEl) touchDragEl.style.opacity = '1';
        document.removeEventListener('touchmove', move);
        document.removeEventListener('touchend', end);
      };
      document.addEventListener('touchmove', move, { passive: false });
      document.addEventListener('touchend', end);
    }

    function handleDrop(itemId, zone, practice) {
      const item = practice.items.find(i => i.id === itemId);
      if (!item) return;
      const zoneId = zone.dataset.zone;
      const zoneDef = practice.zones.find(z => z.id === zoneId);

      if (practice.zones.length === 1) {
        const drag = document.querySelector(`.draggable[data-item="${itemId}"]`);
        if (drag && drag.classList.contains('correct')) return;
        const count = zone.querySelectorAll('.draggable.correct').length;
        const order = practice.items.map(i => i.id);
        if (itemId === order[count]) {
          if (drag) { drag.classList.add('correct'); drag.draggable = false; zone.appendChild(drag); }
          const msg = document.getElementById('pfb');
          msg.className = 'fb correct show'; msg.innerHTML = `✅ Correct order!`;
          playSound('correct');
          if (zone.querySelectorAll('.draggable.correct').length === practice.items.length) finishPracticeAuto();
        } else {
          const drag = document.querySelector(`.draggable[data-item="${itemId}"]`);
          if (drag) { drag.classList.add('wrong-shake'); setTimeout(() => drag.classList.remove('wrong-shake'), 500); }
          const msg = document.getElementById('pfb');
          msg.className = 'fb clue show'; msg.innerHTML = `❌ Not the right order. Think about the steps.`;
          playSound('wrong');
        }
        return;
      }

      if (zoneDef && zoneDef.accepts.includes(itemId)) {
        const drag = document.querySelector(`.draggable[data-item="${itemId}"]`);
        if (drag) { drag.classList.add('correct'); drag.draggable = false; zone.appendChild(drag); }
        const msg = document.getElementById('pfb');
        msg.className = 'fb correct show'; msg.innerHTML = `✅ Correct!`;
        playSound('correct');
        if (document.querySelectorAll('.draggable.correct').length === practice.items.length) finishPracticeAuto();
      } else {
        const drag = document.querySelector(`.draggable[data-item="${itemId}"]`);
        if (drag) { drag.classList.add('wrong-shake'); setTimeout(() => drag.classList.remove('wrong-shake'), 500); }
        const msg = document.getElementById('pfb');
        msg.className = 'fb clue show'; msg.innerHTML = `❌ Not quite. Think about what this item actually does.`;
        playSound('wrong');
      }
    }

    function finishPracticeAuto() {
      const msg = document.getElementById('pfb');
      msg.className = 'fb correct show'; msg.innerHTML = `🎉 Excellent! Practice complete!`;
      document.getElementById('pnext').classList.add('show');
    }

    function finishPractice() {
      activeMission.practiceDone = true;
      saveGame(true);
      renderQ();
    }

    /* ============ QUESTIONS ============ */
    function renderQ() {
      const m = activeMission;
      if (m.idx >= m.questions.length) {
        m.done = true;
        const nextId = m.id + 1;
        if (state.districts[nextId]) state.districts[nextId].unlocked = true;
        state.districtsDone = state.districts.filter(d => d.done).length;
        updateHUD(); checkAchievements(); rebuildCity(); saveGame(true);
        if (state.districtsDone === state.districts.length) showFinal();
        else toast('✅ District Complete! Next unlocked!', true);
        closeModal();
        return;
      }
      const q = m.questions[m.idx];
      const progress = (m.idx / m.questions.length) * 100;
      modalContent.innerHTML = `
    <div class="m-header">
      <div class="m-icon">${m.icon}</div>
      <div><h2>${m.name}</h2><p>Challenge ${m.idx + 1} of ${m.questions.length}</p></div>
    </div>
    <div class="progress-wrap"><div class="progress-fill" style="width:${progress}%"></div></div>
    <div class="q-box">
      <div class="q-num">Question ${m.idx + 1}</div>
      <div class="q-text">${q.q}</div>
      <div class="options" id="opts">
        ${q.o.map((opt, i) => `<button class="option" data-i="${i}" onclick="pick(${i})">${opt}</button>`).join('')}
      </div>
      <div class="fb" id="fb"></div>
      <button class="next-btn" id="nextBtn" onclick="nextQ()">Next ➜</button>
    </div>
  `;
      answered = false;
    }

    /* ============================================================
       MAIN ANSWER FUNCTION — shows EXPLANATION on correct,
       CLUE on wrong (does NOT reveal the answer)
       ============================================================ */
    function pick(i) {
      if (answered) return;
      const q = activeMission.questions[activeMission.idx];
      const opts = document.querySelectorAll('.option');
      const fb = document.getElementById('fb');

      if (i === q.c) {
        answered = true;
        opts.forEach(o => o.classList.add('dis'));
        opts[i].classList.add('correct');
        state.score += 10; state.correct++; state.total++; state.streak++; state.coins += 5;
        if (state.streak > state.bestStreak) state.bestStreak = state.streak;

        const expl = q.e || '';
        const explHTML = expl
          ? `<div class="expl-box"><div class="expl-title">📘 Explanation</div>${expl}</div>`
          : '';

        if (state.streak > 0 && state.streak % 3 === 0) {
          state.score += 5; state.coins += 3;
          fb.className = 'fb correct show';
          fb.innerHTML = `✅ <strong>Correct!</strong> +10 points · +5 coins · 🔥 Streak ${state.streak} bonus +5!${explHTML}`;
        } else {
          fb.className = 'fb correct show';
          fb.innerHTML = `✅ <strong>Correct!</strong> +10 points · +5 coins${explHTML}`;
        }
        addXP(15); playSound('correct'); updateHUD(); checkAchievements();
        document.getElementById('nextBtn').classList.add('show');
        saveGame(true);
      } else {
        opts[i].classList.add('wrong'); opts[i].classList.add('dis');
        state.streak = 0;
        fb.className = 'fb clue show';
        fb.innerHTML = `🧠 <strong>Learning Clue:</strong> ${q.clue}`;
        playSound('wrong'); updateHUD();
      }
    }

    function nextQ() {
      activeMission.idx++;
      saveGame(true);
      renderQ();
    }

    function updateHUD() {
      document.getElementById('score').textContent = state.score;
      document.getElementById('coins').textContent = state.coins;
      document.getElementById('missions').textContent = state.districtsDone + '/7';
      document.getElementById('streak').textContent = state.streak;
      updateXPUI();
    }

    /* ============================================================
       ACHIEVEMENTS
       ============================================================ */
    function checkAchievements() {
      ACHV.forEach(a => {
        if (!state.achievements[a.id] && a.check(state)) {
          state.achievements[a.id] = true;
          toast(`🏅 Achievement: ${a.name}!`, true);
          playSound('levelup');
        }
      });
      saveGame(true);
    }

    function openAchievements() {
      const grid = document.getElementById('achv-grid');
      grid.innerHTML = '';
      ACHV.forEach(a => {
        const unlocked = state.achievements[a.id];
        const card = document.createElement('div');
        card.className = 'achv-card ' + (unlocked ? 'unlocked' : 'locked');
        card.innerHTML = `<div class="ai">${unlocked ? a.icon : '🔒'}</div><div class="an">${a.name}</div><div class="ad">${a.desc}</div>`;
        grid.appendChild(card);
      });
      document.getElementById('achv-overlay').classList.add('active');
    }

    function openPicker() {
      const grid = document.getElementById('picker-grid');
      grid.innerHTML = '';
      state.districts.forEach((d, i) => {
        const card = document.createElement('div');
        card.className = 'picker-card';
        if (!d.unlocked) card.style.opacity = '0.5';
        card.innerHTML = `<div class="pi">${d.icon}</div><div class="pn">${d.name}</div><div class="ps">${d.unlocked ? (d.done ? '✓ Completed' : d.idx + '/' + d.questions.length) : '🔒 Locked'}</div>`;
        card.addEventListener('click', () => {
          if (!d.unlocked) { toast('🔒 Locked!', false); return; }
          document.getElementById('picker-overlay').classList.remove('active');
          openMission(i);
        });
        grid.appendChild(card);
      });
      document.getElementById('picker-overlay').classList.add('active');
    }

    function showFinal() {
      const acc = state.total === 0 ? 100 : Math.round(state.correct / state.total * 100);
      document.getElementById('f-score').textContent = state.score + ' Points · ' + state.coins + ' Coins';
      document.getElementById('f-stats').innerHTML = `Level <b>${state.level}</b> — ${state.title} · Accuracy <b>${acc}%</b> · Best Streak <b>${state.bestStreak}</b>`;
      let msg = acc >= 90 ? "🏅 Outstanding! You mastered PC City!" :
        acc >= 70 ? "🎖️ Great job! Review weaker areas." :
          "📘 Good effort! Replay districts to strengthen.";
      document.getElementById('f-msg').textContent = msg;
      document.getElementById('final-screen').classList.add('show');
    }

    /* ============================================================
       INIT
       ============================================================ */
    loadGame();
    rebuildCity();
    updateHUD();
    updatePlayerPos();
    gameLoop();

    setInterval(() => saveGame(true), 30000);
  </script>
</body>

</html>
