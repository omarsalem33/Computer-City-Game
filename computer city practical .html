<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PC City — Discovery Lab</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      background: #05050f;
      color: #fff;
      user-select: none;
    }

    #app {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
    }

    /* ============ TOP BAR ============ */
    #topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      background: linear-gradient(90deg, rgba(10, 10, 30, 0.98), rgba(20, 20, 50, 0.98));
      border-bottom: 2px solid #4facfe;
      box-shadow: 0 0 25px rgba(79, 172, 254, 0.4);
      z-index: 100;
      flex-wrap: wrap;
      gap: 10px;
    }

    #topbar h1 {
      font-size: 1em;
      color: #4facfe;
      letter-spacing: 2px;
    }

    #topbar h1 span {
      color: #ffd700;
    }

    .bar-stats {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
    }

    .bar-stat {
      text-align: center;
      min-width: 52px;
    }

    .bar-stat .lbl {
      font-size: 0.58em;
      color: #8a8ab0;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .bar-stat .val {
      font-size: 1em;
      font-weight: bold;
      color: #ffd700;
    }

    .bar-stat .val.blue {
      color: #4facfe;
    }

    .bar-stat .val.green {
      color: #00e676;
    }

    .bar-stat .val.purple {
      color: #a855f7;
    }

    /* ============ STAGE ============ */
    #stage {
      flex: 1;
      position: relative;
      overflow: auto;
      background:
        radial-gradient(circle at 20% 20%, #1a1a4a 0%, transparent 55%),
        radial-gradient(circle at 80% 80%, #2a1050 0%, transparent 55%),
        linear-gradient(180deg, #0a0a2a 0%, #05050f 100%);
      padding: 24px;
    }

    .stars-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: #fff;
      border-radius: 50%;
      animation: twinkle 3s infinite;
    }

    @keyframes twinkle {

      0%,
      100% {
        opacity: 0.15;
      }

      50% {
        opacity: 1;
      }
    }

    .stations-grid {
      position: relative;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 22px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .station-card {
      position: relative;
      min-height: 200px;
      background: linear-gradient(145deg, #1e1e4a, #101030);
      border: 3px solid #4facfe;
      border-radius: 20px;
      cursor: pointer;
      transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s;
      padding: 20px 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px rgba(79, 172, 254, 0.5);
    }

    .station-card:hover {
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 0 60px rgba(79, 172, 254, 1);
      border-color: #00f2fe;
    }

    .station-card.done {
      border-color: #00e676;
      box-shadow: 0 0 35px rgba(0, 230, 118, 0.8);
    }

    .station-card.done::before {
      content: '✓';
      position: absolute;
      top: -14px;
      right: -14px;
      width: 38px;
      height: 38px;
      background: #00e676;
      color: #05050f;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3em;
      font-weight: bold;
      box-shadow: 0 0 20px #00e676;
    }

    .station-card .sc-icon {
      font-size: 3.4em;
      margin-bottom: 10px;
      filter: drop-shadow(0 0 12px rgba(79, 172, 254, 0.8));
    }

    .station-card h3 {
      font-size: 1em;
      color: #fff;
      margin-bottom: 5px;
    }

    .station-card .sc-sub {
      font-size: 0.75em;
      color: #8a8ab0;
      line-height: 1.35;
    }

    .station-card .sc-badge {
      position: absolute;
      bottom: -14px;
      left: 50%;
      transform: translateX(-50%);
      background: #4facfe;
      color: #05050f;
      font-size: 0.72em;
      padding: 4px 14px;
      border-radius: 12px;
      font-weight: bold;
      white-space: nowrap;
      box-shadow: 0 0 15px rgba(79, 172, 254, 0.7);
    }

    .station-card.done .sc-badge {
      background: #00e676;
    }

    /* ============ LAB MODAL ============ */
    #lab-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      z-index: 1000;
      justify-content: center;
      align-items: flex-start;
      padding: 15px;
      backdrop-filter: blur(10px);
      overflow-y: auto;
    }

    #lab-overlay.active {
      display: flex;
    }

    #lab {
      background: linear-gradient(145deg, #141432, #08081a);
      border: 2px solid #4facfe;
      border-radius: 22px;
      max-width: 1200px;
      width: 100%;
      margin: auto;
      padding: 22px;
      position: relative;
      box-shadow: 0 0 90px rgba(79, 172, 254, 0.7);
    }

    #close-lab {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(255, 82, 82, 0.2);
      border: 1px solid #ff5252;
      color: #ff5252;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 1.1em;
      cursor: pointer;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
    }

    #close-lab:hover {
      background: #ff5252;
      color: #fff;
    }

    .lab-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
      padding-bottom: 14px;
      border-bottom: 2px solid rgba(79, 172, 254, 0.3);
      flex-wrap: wrap;
    }

    .lab-header .lh-icon {
      font-size: 3em;
    }

    .lab-header .lh-text {
      flex: 1;
      min-width: 200px;
    }

    .lab-header h2 {
      font-size: 1.35em;
      color: #4facfe;
    }

    .lab-header p {
      font-size: 0.82em;
      color: #b8b8d0;
      margin-top: 3px;
    }

    .timer-badge {
      background: rgba(10, 10, 30, 0.9);
      border: 2px solid #4facfe;
      padding: 6px 14px;
      border-radius: 14px;
      font-family: monospace;
      font-size: 0.85em;
      color: #4facfe;
      font-weight: bold;
    }

    .objective {
      display: flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(90deg, rgba(255, 215, 0, 0.15), rgba(255, 215, 0, 0.03));
      border: 2px solid #ffd700;
      border-radius: 14px;
      padding: 12px 18px;
      margin-bottom: 14px;
      color: #ffe082;
      font-size: 0.9em;
      font-weight: bold;
    }

    .objective .obj-icon {
      font-size: 1.4em;
    }

    .progress-dots {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .pdot {
      width: 40px;
      height: 10px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(79, 172, 254, 0.3);
      transition: all 0.3s;
      position: relative;
    }

    .pdot.done {
      background: #00e676;
      box-shadow: 0 0 15px rgba(0, 230, 118, 0.7);
      border-color: #00e676;
    }

    .pdot.done::after {
      content: '✓';
      position: absolute;
      top: -22px;
      left: 50%;
      transform: translateX(-50%);
      color: #00e676;
      font-size: 0.8em;
      font-weight: bold;
    }

    .work-area {
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 18px;
    }

    @media (max-width:820px) {
      .work-area {
        grid-template-columns: 1fr;
      }
    }

    .board-canvas {
      background: radial-gradient(circle at center, #0d1a35, #060e1a);
      border: 2px solid rgba(79, 172, 254, 0.4);
      border-radius: 18px;
      padding: 18px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 360px;
      overflow: hidden;
    }

    .board-canvas::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        repeating-linear-gradient(0deg, rgba(79, 172, 254, 0.07) 0 1px, transparent 1px 40px),
        repeating-linear-gradient(90deg, rgba(79, 172, 254, 0.07) 0 1px, transparent 1px 40px);
    }

    .mb {
      position: relative;
      width: 100%;
      max-width: 440px;
      aspect-ratio: 1.2;
      background: linear-gradient(145deg, #0a5a3a, #053020);
      border-radius: 14px;
      border: 3px solid #063d28;
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.7), 0 0 30px rgba(79, 172, 254, 0.35);
      overflow: hidden;
    }

    .zone {
      position: absolute;
      border: 3px dashed rgba(79, 172, 254, 0.55);
      border-radius: 10px;
      background: rgba(79, 172, 254, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      cursor: pointer;
      text-align: center;
      padding: 2px;
      flex-direction: column;
    }

    .zone.over {
      background: rgba(79, 172, 254, 0.35);
      border-color: #00f2fe;
      box-shadow: 0 0 30px #00f2fe;
      transform: scale(1.05);
    }

    .zone.correct {
      border-style: solid;
      border-color: #00e676;
      background: rgba(0, 230, 118, 0.14);
    }

    .zone.highlight {
      box-shadow: 0 0 20px 4px rgba(255, 215, 0, 0.7) !important;
      border-color: #ffd700 !important;
      animation: pulseGlow 1s infinite;
    }

    @keyframes pulseGlow {

      0%,
      100% {
        box-shadow: 0 0 20px 4px rgba(255, 215, 0, 0.4);
      }

      50% {
        box-shadow: 0 0 30px 8px rgba(255, 215, 0, 0.8);
      }
    }

    .zone .lbl {
      padding: 2px 4px;
      font-size: 9px;
      font-weight: bold;
      color: #9dc7ff;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      line-height: 1.1;
      pointer-events: none;
    }

    /* Stack of placed parts inside a zone */
    .placed {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      padding: 4px;
    }

    .placed .main-icon {
      font-size: 2em;
      line-height: 1;
    }

    .placed .installed-lbl {
      font-size: 0.65em;
      color: #9effbf;
      margin-top: 3px;
      font-weight: bold;
    }

    .placed .badge-row {
      display: flex;
      gap: 3px;
      margin-top: 6px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .placed .badge-row .mini-badge {
      background: rgba(0, 230, 118, 0.25);
      border: 1px solid #00e676;
      border-radius: 6px;
      padding: 2px 4px;
      font-size: 0.7em;
      line-height: 1;
    }

    .tray {
      background: rgba(20, 20, 50, 0.75);
      border: 2px solid rgba(79, 172, 254, 0.35);
      border-radius: 18px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      min-height: 360px;
    }

    .tray h4 {
      font-size: 0.82em;
      color: #4facfe;
      margin-bottom: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-align: center;
    }

    .tray-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .part {
      background: linear-gradient(145deg, #2a2a5a, #1a1a3a);
      border: 2px solid #4facfe;
      border-radius: 12px;
      padding: 11px 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: transform 0.15s, box-shadow 0.2s;
      font-size: 0.9em;
      box-shadow: 0 0 12px rgba(79, 172, 254, 0.35);
    }

    .part:hover:not(.used) {
      transform: translateX(4px);
      box-shadow: 0 0 22px rgba(79, 172, 254, 0.7);
    }

    .part .p-icon {
      font-size: 1.7em;
    }

    .part .p-name {
      font-size: 0.88em;
      color: #fff;
      font-weight: bold;
    }

    .part .p-tip {
      font-size: 0.72em;
      color: #8a8ab0;
      margin-top: 2px;
    }

    .part.used {
      opacity: 0.32;
      pointer-events: none;
      border-color: #555;
      box-shadow: none;
      filter: grayscale(1);
    }

    .part.selected {
      outline: 3px solid #ffd700;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.9);
      transform: scale(1.03);
    }

    .feedback-box {
      margin-top: 14px;
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 0.92em;
      line-height: 1.55;
      display: none;
    }

    .feedback-box.show {
      display: block;
      animation: fbIn 0.3s;
    }

    @keyframes fbIn {
      from {
        opacity: 0;
        transform: translateY(-6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .feedback-box.ok {
      background: rgba(0, 230, 118, 0.13);
      border-left: 4px solid #00e676;
      color: #a0ffc0;
    }

    .feedback-box.err {
      background: rgba(255, 193, 7, 0.13);
      border-left: 4px solid #ffc107;
      color: #ffe082;
    }

    .lab-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 26px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-weight: bold;
      font-family: inherit;
      font-size: 0.88em;
      transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
    }

    .btn.primary {
      background: linear-gradient(90deg, #4facfe, #00f2fe);
      color: #05050f;
      box-shadow: 0 5px 20px rgba(79, 172, 254, 0.55);
    }

    .btn.primary:hover {
      transform: translateY(-2px) scale(1.03);
    }

    .btn.ghost {
      background: transparent;
      border: 2px solid #4facfe;
      color: #4facfe;
    }

    .btn.ghost:hover {
      background: #4facfe;
      color: #05050f;
    }

    .btn.gold {
      background: linear-gradient(90deg, #ffd700, #ff8c00);
      color: #05050f;
    }

    .btn.ghost-gold {
      background: transparent;
      border: 2px solid #ffd700;
      color: #ffd700;
    }

    .btn.ghost-gold:hover {
      background: #ffd700;
      color: #05050f;
    }

    .hint-btn {
      background: transparent;
      border: 2px dashed #ffc107;
      color: #ffc107;
      padding: 9px 18px;
      border-radius: 22px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.82em;
      font-weight: bold;
      transition: 0.25s;
      margin-top: 12px;
    }

    .hint-btn:hover {
      background: rgba(255, 193, 7, 0.15);
    }

    .explanation {
      background: linear-gradient(145deg, rgba(79, 172, 254, 0.08), rgba(168, 85, 247, 0.08));
      border: 2px solid #4facfe;
      border-radius: 18px;
      padding: 22px;
      margin-top: 16px;
    }

    .explanation h3 {
      color: #4facfe;
      font-size: 1.15em;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .explanation .exp-step {
      background: rgba(10, 10, 30, 0.65);
      border-left: 4px solid #00e676;
      border-radius: 10px;
      padding: 14px 18px;
      margin-bottom: 10px;
      line-height: 1.55;
      font-size: 0.92em;
      color: #d0d0f0;
    }

    .explanation .exp-step .st-title {
      color: #00e676;
      font-weight: bold;
      margin-bottom: 5px;
      display: block;
    }

    .explanation .exp-step .st-why {
      color: #b8b8d0;
      font-size: 0.9em;
      margin-top: 6px;
    }

    .explanation .exp-step .st-why::before {
      content: '💡 ';
    }

    .explanation .takeaway {
      margin-top: 16px;
      padding: 14px 18px;
      background: rgba(168, 85, 247, 0.12);
      border-left: 4px solid #a855f7;
      border-radius: 10px;
      color: #d8c7f8;
      font-size: 0.9em;
      line-height: 1.6;
    }

    #confetti {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 4000;
      overflow: hidden;
    }

    .conf {
      position: absolute;
      font-size: 1.6em;
      animation: confFall 2.2s linear forwards;
    }

    @keyframes confFall {
      0% {
        transform: translateY(-40px) rotate(0deg);
        opacity: 1;
      }

      100% {
        transform: translateY(100vh) rotate(720deg);
        opacity: 0;
      }
    }

    #final {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: radial-gradient(circle at center, #1a1a4a, #05050f);
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
      padding: 30px;
      overflow-y: auto;
    }

    #final.show {
      display: flex;
    }

    #final .trophy {
      font-size: 7em;
      filter: drop-shadow(0 0 40px #ffd700);
    }

    #final h1 {
      font-size: 2.6em;
      background: linear-gradient(90deg, #ffd700, #ff8c00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 14px 0;
      letter-spacing: 3px;
    }

    #final .msg {
      color: #b8b8d0;
      font-size: 1.02em;
      max-width: 640px;
      line-height: 1.7;
    }

    #final .score {
      color: #4facfe;
      font-size: 1.6em;
      margin: 14px 0;
      font-weight: bold;
    }

    #final .btn {
      margin-top: 20px;
    }

    @media (max-width:640px) {
      #topbar h1 {
        font-size: 0.85em;
      }

      .bar-stats {
        gap: 10px;
      }

      .bar-stat .lbl {
        font-size: 0.5em;
      }

      .bar-stat .val {
        font-size: 0.88em;
      }

      #lab {
        padding: 14px;
      }

      .lab-header .lh-icon {
        font-size: 2.2em;
      }

      .lab-header h2 {
        font-size: 1.05em;
      }

      .zone .lbl {
        font-size: 7px;
      }

      .btn {
        padding: 10px 20px;
        font-size: 0.82em;
      }
    }
  </style>
</head>

<body>

  <div id="app">
    <div id="topbar">
      <h1>🧪 PC CITY <span>· DISCOVERY LAB</span></h1>
      <div class="bar-stats">
        <div class="bar-stat">
          <div class="lbl">XP</div>
          <div class="val" id="stat-xp">0</div>
        </div>
        <div class="bar-stat">
          <div class="lbl">Labs</div>
          <div class="val blue" id="stat-labs">0/7</div>
        </div>
        <div class="bar-stat">
          <div class="lbl">Stars</div>
          <div class="val green" id="stat-stars">0</div>
        </div>
        <div class="bar-stat">
          <div class="lbl">Badges</div>
          <div class="val purple" id="stat-badges">0</div>
        </div>
      </div>
    </div>

    <div id="stage">
      <div class="stars-layer" id="stars-layer"></div>
      <div class="stations-grid" id="stations-grid"></div>
    </div>
  </div>

  <div id="lab-overlay">
    <div id="lab">
      <button id="close-lab" onclick="closeLab()">✕</button>
      <div id="lab-content"></div>
    </div>
  </div>

  <div id="final">
    <div class="trophy">🏆</div>
    <h1>HARDWARE ENGINEER!</h1>
    <div class="score" id="final-score">0 XP · 0 Stars · 0 Badges</div>
    <p class="msg" id="final-msg"></p>
    <button class="btn primary" onclick="location.reload()">🔄 Play Again</button>
    <button class="btn ghost-gold" onclick="resetProgress()">🗑️ Reset Progress</button>
  </div>

  <div id="confetti"></div>

  <script>
    /* ============================================================
       PC CITY — DISCOVERY LAB v2.4 (STACKING FIXED)
       ============================================================ */

    const SAVE_KEY = 'pcCityDiscovery_v24';

    const state = { xp: 0, stars: 0, badges: 0, labsDone: 0, labs: [] };

    /* ============================================================
       LAB DEFINITIONS
       ============================================================ */
    state.labs = [
      {
        id: 0, name: 'CPU Installation', icon: '🧠', sub: 'Install the processor on the motherboard', done: false,
        goal: 'Install the CPU onto the motherboard. Figure out the correct order yourself!',
        order: ['cpu', 'lock', 'paste', 'cooler', 'fan'],
        zones: [
          { id: 'socket', x: 35, y: 30, w: 30, h: 30, label: 'CPU Socket' },
          { id: 'fanhdr', x: 8, y: 10, w: 18, h: 12, label: 'CPU_FAN Header' }

    const $ = (s, r = document) => r.querySelector(s);
    const $$ = (s, r = document) => [...r.querySelectorAll(s)];

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function getPartIcon(partId) {
      const map = {
        cpu: '🧠', lock: '🔒', paste: '🧴', cooler: '❄️', fan: '🔌',
        clips: '📂', ram: '💾', push: '👇',
        prep: '🔄', hsf: '❄️', press: '👆',
        atx: '🔌', eps: '⚡', sata: '💽',
        hdmi: '📺', usb: '🖱️', eth: '🌐', audio: '🎧',
        pump: '⚙️', rad: '🌡️', fanx: '🌀',
        strap: '⚡', poweroff: '🔌', blower: '💨', paste2: '🧴', poweron: '⚡'
      };
      return map[partId] || '🔧';
    }

    /* ============================================================
       SAVE / LOAD
       ============================================================ */
    function saveGame() {
      const save = {
        xp: state.xp, stars: state.stars, badges: state.badges,
        labs: state.labs.map(l => ({ id: l.id, done: l.done }))
      };
      try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { }
    }
    function loadGame() {
      try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (!raw) return;
        const save = JSON.parse(raw);
        state.xp = save.xp || 0;
        state.stars = save.stars || 0;
        state.badges = save.badges || 0;
        (save.labs || []).forEach(sl => {
          const lab = state.labs.find(l => l.id === sl.id);
          if (lab) lab.done = sl.done;
        });
        state.labsDone = state.labs.filter(l => l.done).length;
      } catch (e) { }
    }
    function resetProgress() {
      if (!confirm('Reset all progress?')) return;
      localStorage.removeItem(SAVE_KEY);
      location.reload();
    }

    /* ============================================================
       AUDIO
       ============================================================ */
    let audioCtx = null;
    function ensureAudio() {
      if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } }
    }
    function playSound(type) {
      ensureAudio(); if (!audioCtx) return;
      const notes = {
        ok: [{ f: 660, d: 0.07 }, { f: 880, d: 0.1 }],
        err: [{ f: 220, d: 0.11 }, { f: 180, d: 0.13 }],
        win: [{ f: 523, d: 0.08 }, { f: 659, d: 0.08 }, { f: 784, d: 0.08 }, { f: 1047, d: 0.2 }]
      };
      const seq = notes[type] || notes.ok;
      let t = audioCtx.currentTime;
      seq.forEach(n => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'sine'; o.frequency.value = n.f;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.12, t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t + n.d);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(t); o.stop(t + n.d);
        t += n.d * 0.9;
      });
    }

    /* ============================================================
       TRAY
       ============================================================ */
    function renderTray() {
      const tray = $('#tray-list');
      if (!tray) return;
      tray.innerHTML = '';
      shuffledParts.forEach(p => {
        const isUsed = placedParts.includes(p.id);
        const el = document.createElement('div');
        el.className = 'part' + (isUsed ? ' used' : '') + (selectedPartId === p.id ? ' selected' : '');
        el.dataset.partId = p.id;
        el.innerHTML = `
      <div class="p-icon">${p.icon}</div>
      <div>
        <div class="p-name">${p.name}</div>
        <div class="p-tip">${p.tip}</div>
      </div>
    `;
        if (!isUsed) {
          el.addEventListener('click', (e) => {
            e.stopPropagation();
            onPartClick(p.id);
          });
        }
        tray.appendChild(el);
      });
    }

    function onPartClick(partId) {
      if (placedParts.includes(partId)) return;
      selectedPartId = partId;

      // Highlight selected part
      $$('.part', labContent).forEach(p => p.classList.remove('selected'));
      const partEl = labContent.querySelector(`.part[data-part-id="${partId}"]`);
      if (partEl) partEl.classList.add('selected');

      // Highlight available zones
      $$('.zone', labContent).forEach(z => {
        if (!z.classList.contains('correct')) z.classList.add('highlight');
      });

      const part = activeLab.parts.find(p => p.id === partId);
      showFb('err', `🎯 Now click the correct location on the motherboard for <b>${part.name}</b>.`, false);
    }

    /* ============================================================
       ZONE CLICK HANDLER — no blocking of "correct" zones
       ============================================================ */
    function attachZoneHandlers() {
      $$('.zone', labContent).forEach(z => {
        z.addEventListener('click', (e) => {
          e.stopPropagation();
          if (!selectedPartId) {
            showFb('err', '👆 First click a part from the tray, then click a location on the motherboard.', true);
            return;
          }
          handleDrop(selectedPartId, z);
        });
      });
    }

    /* ============================================================
       DROP HANDLER — with stacking visual
       ============================================================ */
    function handleDrop(partId, zoneEl) {
      const lab = activeLab;
      if (!lab) return;

      const stepIndex = placedParts.length;
      const nextExpected = lab.order[stepIndex];
      if (!nextExpected) return;

      const expectedZone = lab.partZone[nextExpected];
      const zoneId = zoneEl.dataset.zoneId;

      // ---------- Correct part & zone ----------
      if (partId === nextExpected && zoneId === expectedZone) {
        placedParts.push(partId);
        selectedPartId = null;

        // Mark the zone as used but keep clickable
        zoneEl.classList.add('correct');
        zoneEl.classList.remove('highlight');

        // Build the visual with previous parts as badges
        const partsOnThisZone = lab.order
          .slice(0, placedParts.length)
          .filter(id => lab.partZone[id] === zoneId);
        const mainPart = partsOnThisZone[partsOnThisZone.length - 1];
        const previousParts = partsOnThisZone.slice(0, -1);

        zoneEl.innerHTML = `
      <div class="placed">
        <div class="main-icon">${getPartIcon(mainPart)}</div>
        <div class="installed-lbl">✔ Installed</div>
        ${previousParts.length ? `
          <div class="badge-row">
            ${previousParts.map(p => {
          const part = lab.parts.find(x => x.id === p);
          return `<span class="mini-badge" title="${part.name}">${getPartIcon(p)}</span>`;
        }).join('')}
          </div>
        ` : ''}
      </div>
    `;

        // Clear highlights everywhere
        $$('.zone', labContent).forEach(z => z.classList.remove('highlight'));
        $$('.part', labContent).forEach(p => p.classList.remove('selected'));

        renderTray();
        updateProgressDots();
        playSound('ok');
        burstConfetti(12, false);

        if (placedParts.length === lab.order.length) {
          showFb('ok', `🎉 <b>Lab Complete!</b> You discovered all ${lab.order.length} steps!`, false);
          setTimeout(finishLab, 1000);
        } else {
          showFb('ok', `✅ Correct! Step ${placedParts.length} of ${lab.order.length} done. <b>Now pick the next part.</b>`, true);
        }
        return;
      }

      // ---------- Correct part, wrong zone ----------
      if (partId === nextExpected) {
        const partName = lab.parts.find(p => p.id === partId).name;
        if (partId === 'lock') {
          showFb('err', `🧠 <b>You're in the right direction!</b> The retention arm locks the CPU in place. Click on the <b>CPU Socket</b> area (where you placed the CPU) to lower it.`, true);
        } else {
          showFb('err', `🧠 <b>Right part, wrong location.</b> Look carefully at the motherboard — where would "${partName}" physically fit?`, true);
        }
        playSound('err');
        return;
      }

      // ---------- Already used ----------
      if (placedParts.includes(partId)) {
        showFb('err', '🧠 This part is already installed. Move on to the next step!', true);
        return;
      }

      // ---------- Appears later ----------
      const appearsLater = lab.order.indexOf(partId) > stepIndex;
      if (appearsLater) {
        const partName = lab.parts.find(p => p.id === partId).name;
        if (partId === 'lock') {
          showFb('err', `🧠 <b>Wait — the CPU must be placed first.</b> Install the CPU into the socket, then you can lower the retention arm to lock it in.`, true);
        } else {
          showFb('err', `🧠 <b>Not yet.</b> Think about what must physically happen <i>before</i> you can use the "${partName}". What needs to be in place first?`, true);
        }
      } else {
        showFb('err', `🧠 That part doesn't belong in this lab. Try a different one.`, true);
      }
      playSound('err');
    }

    /* ============================================================
       FEEDBACK / DOTS / HINT / TIMER
       ============================================================ */
    function showFb(type, html, autoHide) {
      const fb = $('#fb');
      if (!fb) return;
      fb.className = 'feedback-box show ' + (type === 'ok' ? 'ok' : 'err');
      fb.innerHTML = html;
      if (autoHide) {
        clearTimeout(fb._t);
        fb._t = setTimeout(() => fb.classList.remove('show'), 4500);
      }
    }

    function updateProgressDots() {
      $$('#progress-dots .pdot').forEach((d, i) => {
        d.classList.toggle('done', i < placedParts.length);
      });
    }

    function showHint() {
      if (!activeLab) return;
      const nextId = activeLab.order[placedParts.length];
      if (!nextId) { showFb('ok', '🎉 All steps are complete!', true); return; }
      const part = activeLab.parts.find(p => p.id === nextId);
      let hint = `💡 <b>Hint:</b> The next part to install is <b>${part.name}</b>.`;
      if (nextId === 'lock') {
        hint += ` It goes on the <b>CPU Socket</b> — the same zone where you placed the CPU.`;
      } else {
        hint += ` Now figure out <i>where</i> it goes!`;
      }
      showFb('err', hint, true);
    }

    function startTimer() {
      clearInterval(timerInt);
      if (!$('#timer')) return;
      timerInt = setInterval(() => {
        const t = Math.floor((Date.now() - startTime) / 1000);
        const m = String(Math.floor(t / 60)).padStart(2, '0');
        const s = String(t % 60).padStart(2, '0');
        const e = $('#timer');
        if (e) e.textContent = `⏱ ${m}:${s}`;
      }, 500);
    }

    /* ============================================================
       FINISH LAB
       ============================================================ */
    function finishLab() {
      const lab = activeLab;
      if (!lab) return;
      const elapsed = Math.floor((Date.now() - startTime) / 1000);
      const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
      const secs = String(elapsed % 60).padStart(2, '0');

      if (!lab.done) {
        lab.done = true;
        state.labsDone = state.labs.filter(l => l.done).length;
        state.xp += 50; state.stars += 3; state.badges += 1;
        updateTopBar(); rebuildStage(); saveGame();
      }

      labContent.innerHTML = `
    <div class="lab-header">
      <div class="lh-icon">🏆</div>
      <div class="lh-text">
        <h2>${lab.name} — Complete!</h2>
        <p>Time: ${mins}:${secs} · +50 XP · +3 ⭐ · +1 🏅</p>
      </div>
    </div>

    <div class="objective" style="background:linear-gradient(90deg,rgba(0,230,118,0.2),rgba(0,230,118,0.05));border-color:#00e676;color:#a0ffc0;">
      <span class="obj-icon">✅</span>
      <span>You discovered all ${lab.order.length} steps of ${lab.name}!</span>
    </div>

    <div class="explanation">
      <h3>📘 Let's Review — What You Did and Why</h3>
      ${lab.explanation.map((exp, i) => `
        <div class="exp-step">
          <span class="st-title">Step ${i + 1} — ${exp.step}</span>
          <div class="st-why">${exp.why}</div>
        </div>
      `).join('')}
      <div class="takeaway">
        <b>🎓 Key Takeaway:</b> In hardware work, <b>order matters</b>. Doing steps in the wrong sequence — like applying paste before installing the CPU, or opening the case before unplugging the power — can damage components or put you in danger. Understanding <i>why</i> each step exists is what separates a technician from an engineer.
      </div>
    </div>

    <div class="lab-actions">
      <button class="btn primary" onclick="closeLab()">← Back to Labs</button>
      ${state.labsDone === state.labs.length ? '<button class="btn gold" onclick="showFinal()">🎖️ See Certificate</button>' : ''}
    </div>
  `;

      playSound('win');
      burstConfetti(120, true);
      if (state.labsDone === state.labs.length) setTimeout(showFinal, 2400);
    }

    /* ============================================================
       RESET / TOP BAR / FINAL
       ============================================================ */
    function resetLab() {
      if (!activeLab) return;
      placedParts = [];
      selectedPartId = null;
      shuffledParts = shuffle(activeLab.parts);
      startTime = Date.now();
      renderLab();
    }

    function updateTopBar() {
      $('#stat-xp').textContent = state.xp;
      $('#stat-labs').textContent = state.labsDone + '/' + state.labs.length;
      $('#stat-stars').textContent = state.stars;
      $('#stat-badges').textContent = state.badges;
    }

    function showFinal() {
      $('#final-score').textContent = `${state.xp} XP · ${state.stars} ⭐ · ${state.badges} 🏅`;
      $('#final-msg').textContent = 'You have completed all hands-on labs in PC City. You discovered the correct order of every practical procedure by yourself. Well done, Engineer!';
      $('#final').classList.add('show');
    }

    /* ============================================================
       INIT
       ============================================================ */
    loadGame();
    rebuildStage();
    updateTopBar();
    setInterval(saveGame, 30000);
    window.addEventListener('keydown', e => {
      if (e.key === 'Escape' && labOverlay.classList.contains('active')) closeLab();
    });
    window.closeLab = closeLab;
    window.resetLab = resetLab;
    window.showHint = showHint;
    window.showFinal = showFinal;
    window.resetProgress = resetProgress;
  </script>
</body>

</html>
